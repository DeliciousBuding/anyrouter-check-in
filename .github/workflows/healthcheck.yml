name: Configuration healthcheck

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    environment: production
    env:
      REPO: DeliciousBuding/newapi-check-in
    steps:
      - name: secrets 覆盖度自检
        id: audit
        env:
          # 账号配置名保留 ANYROUTER_ACCOUNTS 以兼容既有部署，不代表项目只支持 AnyRouter。
          ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
          PROVIDERS: ${{ secrets.PROVIDERS }}
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
          PROXY_SUBSCRIPTION_URL_FALLBACK: ${{ secrets.PROXY_SUBSCRIPTION_URL_FALLBACK }}
          PROXY_NODE_FILTER: ${{ secrets.PROXY_NODE_FILTER }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: |
          set -euo pipefail
          required="ANYROUTER_ACCOUNTS"
          optional="PROVIDERS PROXY_SUBSCRIPTION_URL PROXY_SUBSCRIPTION_URL_FALLBACK PROXY_NODE_FILTER DINGDING_WEBHOOK EMAIL_USER EMAIL_PASS EMAIL_TO EMAIL_SENDER CUSTOM_SMTP_SERVER PUSHPLUS_TOKEN SERVERPUSHKEY FEISHU_WEBHOOK WEIXIN_WEBHOOK TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID GOTIFY_URL GOTIFY_TOKEN GOTIFY_PRIORITY BARK_KEY BARK_SERVER"
          missing_required=""
          missing_optional=""
          for var in $required; do
            value="${!var:-}"
            if [ -z "$value" ]; then missing_required="$missing_required $var"; fi
          done
          if printf '%s' "${ANYROUTER_ACCOUNTS:-}" | python3 -c 'import json, sys; data = json.load(sys.stdin); raise SystemExit(0 if isinstance(data, list) and any(isinstance(account, dict) and account.get("provider", "anyrouter") == "agentrouter" for account in data) else 1)' 2>/dev/null; then
            echo "AgentRouter accounts detected; proxy subscription is required"
            if [ -z "${PROXY_SUBSCRIPTION_URL:-}" ] && [ -z "${PROXY_SUBSCRIPTION_URL_FALLBACK:-}" ]; then
              missing_required="$missing_required PROXY_SUBSCRIPTION_URL/PROXY_SUBSCRIPTION_URL_FALLBACK"
            fi
          fi
          for var in $optional; do
            value="${!var:-}"
            if [ -z "$value" ]; then missing_optional="$missing_optional $var"; fi
          done
          if [ -n "$missing_required" ]; then
            echo "MISSING_SECRETS=$(echo "$missing_required" | xargs | tr ' ' ',')" >> "$GITHUB_OUTPUT"
            echo "必须 secret 缺失:${missing_required}"
          else
            echo "必须 secret ANYROUTER_ACCOUNTS 已配置 ✓"
          fi
          if [ -n "$missing_optional" ]; then
            echo "可选 secret 未启用（不影响签到）:${missing_optional}"
          fi

      - name: 缺失 secret 飞书告警
        if: steps.audit.outputs.missing_secrets != ''
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          MISSING: ${{ steps.audit.outputs.missing_secrets }}
          REPO: ${{ env.REPO }}
        run: |
          if [ -z "${FEISHU_WEBHOOK:-}" ]; then
            echo "FEISHU_WEBHOOK 未配置，跳过通知"
            exit 0
          fi
          TEXT="⚠️ newapi-check-in 必须 secret 缺失: ${MISSING}，签到将无法运行。请检查 https://github.com/${REPO}/settings/secrets/actions"
          curl -fsSL -X POST "$FEISHU_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$TEXT\"}}"

      - name: 失败状态
        if: steps.audit.outputs.missing_secrets != ''
        run: |
          echo "必须 secret 缺失，配置健康检查失败"
          exit 1
