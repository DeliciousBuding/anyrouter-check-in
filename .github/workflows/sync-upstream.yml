name: Sync upstream & healthcheck

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-healthcheck:
    runs-on: ubuntu-latest
    environment: production
    env:
      REPO: DeliciousBuding/anyrouter-check-in
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步上游 main 到本 fork
        id: sync
        continue-on-error: true
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: millylee/anyrouter-check-in
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步异常飞书通知
        if: steps.sync.outcome == 'failure'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PR_CREATED: ${{ steps.sync.outputs.pr_created }}
          PR_URL: ${{ steps.sync.outputs.pr_url }}
          REPO: ${{ env.REPO }}
        run: |
          if [ "${PR_CREATED:-false}" = "true" ]; then
            TEXT="⚠️ anyrouter-check-in 上游同步冲突，已自动开 PR 请处理: ${PR_URL}"
          else
            TEXT="⚠️ anyrouter-check-in 上游同步异常，请查看日志: https://github.com/${REPO}/actions"
          fi
          curl -fsSL -X POST "$FEISHU_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$TEXT\"}}"

      - name: secrets 覆盖度自检
        id: audit
        env:
          # 上游 checkin.yml 引用的 secret 清单；为空视为未配置
          ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
          PROVIDERS: ${{ secrets.PROVIDERS }}
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: |
          set -euo pipefail
          required="ANYROUTER_ACCOUNTS"
          optional="PROVIDERS PROXY_SUBSCRIPTION_URL DINGDING_WEBHOOK EMAIL_USER EMAIL_PASS EMAIL_TO EMAIL_SENDER CUSTOM_SMTP_SERVER PUSHPLUS_TOKEN SERVERPUSHKEY FEISHU_WEBHOOK WEIXIN_WEBHOOK TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID GOTIFY_URL GOTIFY_TOKEN GOTIFY_PRIORITY BARK_KEY BARK_SERVER"
          missing_required=""
          missing_optional=""
          for var in $required; do
            value="${!var:-}"
            if [ -z "$value" ]; then missing_required="$missing_required $var"; fi
          done
          for var in $optional; do
            value="${!var:-}"
            if [ -z "$value" ]; then missing_optional="$missing_optional $var"; fi
          done
          if [ -n "$missing_required" ]; then
            echo "MISSING_SECRETS=$(echo "$missing_required" | xargs | tr ' ' ',')" >> "$GITHUB_OUTPUT"
            echo "必须 secret 缺失:${missing_required}"
          else
            echo "必须 secret ANYROUTER_ACCOUNTS 已配置 ✓"
          fi
          if [ -n "$missing_optional" ]; then
            echo "可选 secret 未启用（不影响签到）:${missing_optional}"
          fi

      - name: 缺失 secret 飞书告警
        if: steps.audit.outputs.missing_secrets != ''
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          MISSING: ${{ steps.audit.outputs.missing_secrets }}
        run: |
          curl -fsSL -X POST "$FEISHU_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ anyrouter-check-in 必须 secret 缺失: ${MISSING}，签到将无法运行，请到 Settings → Secrets 补充\"}}"
