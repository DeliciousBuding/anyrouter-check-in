name: Keepalive

on:
  schedule:
    # Weekly is well inside GitHub's 60-day inactivity window.
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const workflows = ['checkin.yml', 'keepalive.yml', 'sync-upstream.yml'];

            for (const workflow_id of workflows) {
              await github.rest.actions.enableWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
              });
              core.info(`enabled ${workflow_id}`);
            }
