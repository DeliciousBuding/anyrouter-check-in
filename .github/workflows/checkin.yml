name: AnyRouter 自动签到
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 开启调试模式（截图 artifact、详细日志）
        required: false
        default: false
        type: boolean
      force:
        description: 忽略每日登录门禁，强制执行本次签到
        required: false
        default: false
        type: boolean

concurrency:
  group: checkin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      DEBUG_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: "latest"

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v5
      id: uv-cache
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      run: |
        uv sync --frozen
        echo "✅ 环境初始化完成"

    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont \
          fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf

    - name: 缓存 CloakBrowser 二进制
      uses: actions/cache@v5
      id: cloakbrowser-cache
      with:
        path: ~/.cloakbrowser
        key: ${{ runner.os }}-cloakbrowser-v1
        restore-keys: |
          ${{ runner.os }}-cloakbrowser-

    - name: 安装 CloakBrowser
      run: |
        uv run python -m cloakbrowser install
        echo "✅ CloakBrowser 安装完成"

    - name: 恢复余额历史缓存
      uses: actions/cache/restore@v5
      with:
        path: balance_snapshot.json
        key: balance-snapshot-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          balance-snapshot-${{ github.ref_name }}-
          balance-snapshot-

    - name: 恢复状态文件
      uses: actions/cache/restore@v5
      with:
        path: notify_state.json
        # GitHub Cache key 不可覆盖；每次使用唯一 key 才能保存新状态。
        key: notify-state-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: notify-state-

    - name: 恢复签到状态
      uses: actions/cache/restore@v5
      with:
        path: checkin_state.json
        key: checkin-state-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          checkin-state-${{ github.ref_name }}-
          checkin-state-

    - name: 恢复浏览器 Profile
      # 浏览器 profile 可能含登录态；公开仓默认不持久化，私有 fork 可显式打开。
      if: vars.ENABLE_BROWSER_PROFILE_CACHE == 'true'
      uses: actions/cache/restore@v5
      with:
        path: .browser_profiles
        key: browser-profiles-${{ runner.os }}-${{ hashFiles('.browser_profiles/**') }}
        restore-keys: |
          browser-profiles-${{ runner.os }}-

    - name: 配置代理
      env:
        PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        PROXY_SUBSCRIPTION_URL_FALLBACK: ${{ secrets.PROXY_SUBSCRIPTION_URL_FALLBACK }}
        # 出口地区收窄规则也走 secret：公开仓里不写明我们从哪个地区出去
        PROXY_NODE_FILTER: ${{ secrets.PROXY_NODE_FILTER }}
        PROXY_TEST_URL: https://www.google.com/generate_204
        # 业务侧探测：这个出口对 agentrouter 是否干净（有没有被下发人机验证页）
        PROXY_PROBE_URL: https://agentrouter.org/api/status
        MIHOMO_VERSION: v1.19.27
        PROXY_REQUIRED: false
      run: bash scripts/setup_mihomo_proxy.sh

    - name: 执行签到
      env:
        DEBUG_MODE: ${{ env.DEBUG_MODE }}
        CHECKIN_HEADLESS: false
        CHECKIN_HUMANIZE: true
        CHECKIN_WAIT_TIMEOUT_MS: 120000
        CHECKIN_STRICT: 'true'
        CHECKIN_MAX_ATTEMPTS: '3'
        CHECKIN_MAX_EGRESS_ROTATIONS: '2'
        CHECKIN_STATE_FILE: checkin_state.json
        CHECKIN_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && 'true' || 'false' }}
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
      run: |
        xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run checkin.py

    # cache@v5 的 post-save 默认依赖 job success；严格模式失败时状态不会落盘。
    # 显式 save + always() 才能保证失败账号也持久化，避免下一轮重复登录。
    - name: 保存余额历史缓存
      if: always() && hashFiles('balance_snapshot.json') != ''
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: balance_snapshot.json
        key: balance-snapshot-${{ github.ref_name }}-${{ github.run_id }}

    - name: 保存状态文件
      if: always() && hashFiles('notify_state.json') != ''
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: notify_state.json
        key: notify-state-${{ github.ref_name }}-${{ github.run_id }}

    - name: 保存签到状态
      if: always() && hashFiles('checkin_state.json') != ''
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: checkin_state.json
        key: checkin-state-${{ github.ref_name }}-${{ github.run_id }}

    - name: 上传调试截图
      if: always() && env.DEBUG_MODE == 'true'
      env:
        HTTP_PROXY: ''
        HTTPS_PROXY: ''
      uses: actions/upload-artifact@v4
      with:
        name: checkin-screenshots-${{ github.run_id }}
        path: checkin_screenshots/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14

    - name: 保存浏览器 Profile
      if: always() && vars.ENABLE_BROWSER_PROFILE_CACHE == 'true' && hashFiles('.browser_profiles/**') != ''
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: .browser_profiles
        key: browser-profiles-${{ runner.os }}-${{ hashFiles('.browser_profiles/**') }}

    - name: 停止代理
      if: always()
      run: bash scripts/stop_mihomo_proxy.sh

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        echo "时间: $(date)"
        if [ "${DEBUG_MODE}" = "true" ] && [ -d checkin_screenshots ] && [ "$(ls -A checkin_screenshots 2>/dev/null)" ]; then
          echo "调试截图已上传为 artifact: checkin-screenshots-${{ github.run_id }}"
          ls -la checkin_screenshots/
        fi
